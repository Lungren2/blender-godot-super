[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blender-godot-super"
version = "0.0.0"
description = "Shared MCP foundation for agent-driven Blender and Godot workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "mcp>=2.0.0,<3",
  "pydantic>=2.11,<3",
]

[project.scripts]
blender-godot-super = "super_mcp.server:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/super_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["super_mcp"]
