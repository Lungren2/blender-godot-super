[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blender-godot-super"
version = "0.0.0"
description = "Unified MCP endpoint for agent-driven Blender and Godot workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "fastmcp[tasks]==4.0.1",
  "mcp>=2.0.0,<3",
  "pydantic>=2.13,<3",
  "godot-editor-mcp @ git+https://github.com/hybridindie/godot-mcp.git@daf1cf649f41fc95c403e03859d0461a5b272333",
  "claude-blender @ git+https://github.com/minihellboy/claude-blender.git@5087d87212e0acf3225307c2b3512659c425cc5e",
]

[project.scripts]
blender-godot-super = "super_mcp.server:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/super_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["super_mcp"]
